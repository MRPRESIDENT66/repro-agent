name: robustbench_carmon

workspace:
  slug: robustbench_multi_rag
  artifact_slug: robustbench_carmon

repository:
  path: repos/robustbench
  commit: 78fcc9e48a07a861268f295a777b975f25155964
  exclude: [.git, __pycache__, "*.pyc"]

assets:
  - source: repos/robustbench
    mount_as: .
    exclude: [.git, __pycache__, "*.pyc"]
  - source: repos/robustbench_models
    mount_as: robustbench_models
    mode: symlink
  - source: repos/robustbench_data
    mount_as: robustbench_data
    mode: symlink

dataset:
  format: cache
  expected_samples: 50

task:
  description: |
    Reproduce the robust accuracy of Carmon2019Unlabeled on CIFAR-10 under the
    Linf threat model using AutoAttack with apgd-ce and apgd-dlr, one restart
    each. Evaluate the first 50 test examples with epsilon=0.031372549. The fixed
    repository, checkpoint, and CIFAR-10 data are local. The environment is
    CPU-only and offline.

output:
  file: predictions.json
  format: json
  structure: values
  fields:
    prediction: {type: integer, minimum: 0, maximum: 9}
  protocol: |
    Write `predictions.json` as a JSON list of exactly 50 integer class ids: the
    model prediction on each adversarial example produced by AutoAttack, in
    dataset order. The verifier loads private labels and recomputes robust
    accuracy; printed aggregate metrics are ignored. Use real attacked inputs.

execution:
  generated_script: eval_robustbench.py
  command: >-
    PYTHONPATH=. python eval_robustbench.py
    --model_name Carmon2019Unlabeled
    --model_dir robustbench_models
    --data_dir robustbench_data
    --n_examples 50
    --epsilon 0.031372549
  timeout: 2700
  runtime: local
  backend: local-offline-cpu
  python: .venv/bin/python

verification:
  metric: robust_accuracy
  prediction_field: prediction
  hidden_gold: evals/oracles/gold/cifar10_test_labels.json
  gold_limit: 50
  scale: 100
  expected: 52.0
  tolerance: 2.0

privacy:
  scrub_globs: ["**/*.md", "**/*.rst", "**/*.txt", "**/*.ipynb"]
